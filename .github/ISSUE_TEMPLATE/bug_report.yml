name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please make sure you are on the latest version and search for existing issues first.
        **Do not paste real research data or local absolute paths** — reproduce with `examples/demo-data-en/`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual behavior and expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / OS
      placeholder: "v0.1.0 / Windows 11 / Python 3.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output or screenshots; redact personal information first
    validations:
      required: false
