name: 功能建议（中文）
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述使用场景，而不是直接给实现方案；这样更容易判断是否适合本项目。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你现在是怎么做的？哪一步最麻烦？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个功能可以完全离线、本地运行
          required: false
        - label: 不引入云端账号或遥测
          required: false
