<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>科研日志</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-flask" viewBox="0 0 24 24">
    <path d="M9 3h6M10 3v5.2L4.9 17a2.4 2.4 0 0 0 2.1 3.5h10a2.4 2.4 0 0 0 2.1-3.5L14 8.2V3"/>
    <path d="M7.2 14.5h9.6"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m6-7-7 7 7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.8A1.8 1.8 0 0 1 10.8 3h2.4A1.8 1.8 0 0 1 15 4.8V7M6.5 7l.8 12.2A1.8 1.8 0 0 0 9.1 21h5.8a1.8 1.8 0 0 0 1.8-1.8L17.5 7"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5M8 9h8M8 13h5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2"/><path d="M15.5 8.5V6.2A2.2 2.2 0 0 0 13.3 4H6.2A2.2 2.2 0 0 0 4 6.2v7.1a2.2 2.2 0 0 0 2.2 2.2h2.3"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4.5-4.5M12 15 7.5 10.5M4 19h16"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 19h16"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5A2 2 0 0 1 5.5 4.5h4l2 2.5h7A2 2 0 0 1 20.5 9v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3.5h7l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6.5 20z"/><path d="M13.5 3.5V9h5"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M6.2 6.2a8 8 0 1 0 11.6 0"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-flask"></use></svg></span>
      <span class="brand-name">科研日志</span>
    </div>
    <div class="counts" id="counts"></div>
    <div class="topbar-spacer"></div>
    <label class="search" for="search">
      <svg class="icon"><use href="#i-search"></use></svg>
      <input id="search" type="search" placeholder="搜索项目、目标、小目标" autocomplete="off" spellcheck="false">
      <kbd>Ctrl F</kbd>
    </label>
    <button class="btn btn-primary" id="new-project" type="button">
      <svg class="icon"><use href="#i-plus"></use></svg><span>新建项目</span>
    </button>
    <button class="icon-btn" id="menu-btn" type="button" aria-label="更多操作" aria-haspopup="menu">
      <svg class="icon"><use href="#i-more"></use></svg>
    </button>
    <button class="lang-btn" id="lang-btn" type="button" aria-label="切换语言">EN</button>
  </header>

  <div class="layout">
    <aside class="rail" id="rail" aria-label="项目列表"></aside>
    <main class="main" id="main" tabindex="-1"></main>
    <aside class="side" id="side" aria-label="进展日志"></aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-root" id="modal-root"></div>
<div class="reader-root" id="reader-root"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="markdown.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
