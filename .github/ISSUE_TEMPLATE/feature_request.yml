name: Feature request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the use case first rather than jumping to an implementation; that makes it easier to judge whether it fits the project.
  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: How do you do this today? Which step is the most painful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This feature can run fully offline and locally
          required: false
        - label: It does not require a cloud account or telemetry
          required: false
