name: Bug 报告（中文）
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认使用的是最新版本，并搜索是否已有相似 Issue。
        **不要粘贴真实科研数据或本机绝对路径**，可以用 `examples/demo-data` 复现。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为与预期行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 系统
      placeholder: "v0.1.0 / Windows 11 / Python 3.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可附控制台输出或截图；请先打码个人信息
    validations:
      required: false
